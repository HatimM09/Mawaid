name: Generate New Upload Key & Certificate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate New Keystore and Certificate
        run: |
          KEY_PASS="AlMawaid2026UploadKey"
          
          # Generate brand new RSA 2048 key
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -alias almawaid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Al-Mawaid Upload, OU=Mobile, O=Al-Mawaid, L=Makkah, ST=Makkah, C=SA"

          # Export RFC PEM certificate
          keytool -export -rfc \
            -keystore upload-keystore.jks \
            -alias almawaid \
            -file upload_certificate_new.pem \
            -storepass "$KEY_PASS"

          # Print fingerprints
          echo "==================== CERTIFICATE FINGERPRINTS ===================="
          keytool -list -v -keystore upload-keystore.jks -alias almawaid -storepass "$KEY_PASS" | grep -A 5 "Certificate fingerprints:"
          echo "=================================================================="

          mkdir -p output
          cp upload-keystore.jks output/
          cp upload_certificate_new.pem output/

      - name: Upload Credentials Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-upload-credentials
          path: output/
          retention-days: 7
