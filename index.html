<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060d1a" />
  <meta name="description" content="Al-Mawaid - Daily Tiffin Service" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060d1a" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f4f8" />
  <script>(()=>{function filter(e){let m=e&&(typeof e==='string'?e:e.message);if(m&&/asynchronous response|message channel|channel closed|listener indicated/i.test(m))return true}addEventListener('error',function(e){try{if(filter(e.message)){e.preventDefault();e.stopImmediatePropagation()}}catch(e){}});addEventListener('unhandledrejection',function(e){try{if(filter(e.reason))e.preventDefault()}catch(e){}});let orig=console.error;console.error=function(){let m=[].slice.call(arguments).map(a=>String(a)).join(' ');if(/asynchronous response|message channel|channel closed|listener indicated/i.test(m))return;return orig.apply(this,arguments)}})()</script>
  <title>Al-Mawaid | المَوَائِد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
</head>

<body>
  <!-- Animated splash screen — fades out when React mounts -->
  <div id="splash" style="position:fixed;inset:0;z-index:99999;background:#060d1a;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.5s ease-out;">
    <style>
      @keyframes splashLogoIn { 0% { opacity:0; transform:scale(0.3) rotate(-15deg); } 100% { opacity:1; transform:scale(1) rotate(0deg); } }
      @keyframes splashGlow { 0%,100% { opacity:0.12; transform:scale(0.95); } 50% { opacity:0.3; transform:scale(1.1); } }
      @keyframes splashRing1 { 0% { opacity:0.6; transform:scale(0.5); } 100% { opacity:0; transform:scale(3.2); } }
      @keyframes splashRing2 { 0% { opacity:0.5; transform:scale(0.5); } 100% { opacity:0; transform:scale(2.8); } }
      @keyframes splashRing3 { 0% { opacity:0.4; transform:scale(0.5); } 100% { opacity:0; transform:scale(2.4); } }
      @keyframes splashNameIn { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
      @keyframes splashSubtitleIn { 0% { opacity:0; transform:translateY(15px); } 100% { opacity:1; transform:translateY(0); } }
      @keyframes splashLoaderIn { 0% { opacity:0; } 100% { opacity:1; } }
      @keyframes splashPulse { 0%,100% { transform:scale(1); box-shadow:0 0 30px rgba(212,175,55,0.1); } 50% { transform:scale(1.06); box-shadow:0 0 50px rgba(212,175,55,0.25); } }
      @keyframes splashBreathe { 0%,100% { filter:drop-shadow(0 4px 20px rgba(212,175,55,0.3)); } 50% { filter:drop-shadow(0 8px 35px rgba(212,175,55,0.6)); } }
      @keyframes splashDotBounce { 0%,80%,100% { transform:translateY(0); opacity:0.4; } 40% { transform:translateY(-8px); opacity:1; } }
      @keyframes splashShimmer { 0% { background-position:-200% center; } 100% { background-position:200% center; } }
      @keyframes splashRotate { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
      .splash-logo-area { position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; margin-bottom:28px; }
      .splash-ring { position:absolute; top:50%; left:50%; width:120px; height:120px; margin-top:-60px; margin-left:-60px; border-radius:50%; border:2px solid #D4AF37; animation:splashRing1 2s ease-out infinite; }
      .splash-ring2 { position:absolute; top:50%; left:50%; width:120px; height:120px; margin-top:-60px; margin-left:-60px; border-radius:50%; border:1.5px solid rgba(212,175,55,0.5); animation:splashRing2 2s ease-out 0.65s infinite; }
      .splash-ring3 { position:absolute; top:50%; left:50%; width:120px; height:120px; margin-top:-60px; margin-left:-60px; border-radius:50%; border:1px solid rgba(212,175,55,0.3); animation:splashRing3 2s ease-out 1.3s infinite; }
      .splash-orbit { position:absolute; top:50%; left:50%; width:160px; height:160px; margin-top:-80px; margin-left:-80px; border-radius:50%; border:1px dashed rgba(212,175,55,0.12); animation:splashRotate 8s linear infinite; }
      .splash-orbit-dot { position:absolute; top:-3px; left:50%; width:6px; height:6px; border-radius:50%; background:#D4AF37; box-shadow:0 0 8px #D4AF37; }
      .splash-glow { position:absolute; top:50%; left:50%; width:220px; height:220px; margin-top:-110px; margin-left:-110px; border-radius:50%; background:radial-gradient(circle, #D4AF37 0%, transparent 70%); animation:splashGlow 2.5s ease-in-out infinite; }
      .splash-logo-wrap { position:relative; width:120px; height:120px; border-radius:32px; background:rgba(212,175,55,0.06); border:1.5px solid rgba(212,175,55,0.25); display:flex; align-items:center; justify-content:center; animation:splashLogoIn 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards, splashPulse 2s ease-in-out 1.2s infinite; z-index:2; }
      .splash-logo-wrap img { width:72px; height:72px; animation:splashBreathe 3s ease-in-out infinite; }
      .splash-name { font-family:'Playfair Display',Georgia,serif; font-size:28px; font-weight:800; color:#D4AF37; letter-spacing:3px; opacity:0; animation:splashNameIn 0.6s ease-out 0.5s forwards; background:linear-gradient(90deg, #D4AF37 0%, #F0C239 40%, #D4AF37 80%, #F0C239 100%); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:splashNameIn 0.6s ease-out 0.5s forwards, splashShimmer 3s linear 1.5s infinite; }
      .splash-subtitle { font-family:'Amiri','Noto Nastaliq Urdu',Georgia,serif; font-size:18px; color:rgba(212,175,55,0.55); margin-top:6px; opacity:0; animation:splashSubtitleIn 0.5s ease-out 0.8s forwards; }
      .splash-loader { margin-top:40px; display:flex; gap:8px; opacity:0; animation:splashLoaderIn 0.4s ease-out 1.1s forwards; }
      .splash-dot { width:7px; height:7px; border-radius:50%; background:#D4AF37; animation:splashDotBounce 1.4s ease-in-out infinite; }
      .splash-dot:nth-child(2) { animation-delay:0.18s; }
      .splash-dot:nth-child(3) { animation-delay:0.36s; }
      .splash-tagline { margin-top:16px; font-family:'DM Sans',sans-serif; font-size:11px; color:rgba(212,175,55,0.3); letter-spacing:4px; text-transform:uppercase; opacity:0; animation:splashLoaderIn 0.4s ease-out 1.4s forwards; }
    </style>
    <div class="splash-logo-area">
      <div class="splash-glow"></div>
      <div class="splash-ring"></div>
      <div class="splash-ring2"></div>
      <div class="splash-ring3"></div>
      <div class="splash-orbit"><div class="splash-orbit-dot"></div></div>
      <div class="splash-logo-wrap">
        <img src="/al-mawaid.png" alt="Al-Mawaid" />
      </div>
    </div>
    <div class="splash-name">Al-Mawaid</div>
    <div class="splash-subtitle">المَوَائِد</div>
    <div class="splash-loader">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
    <div class="splash-tagline">Daily Tiffin Service</div>
  </div>
  <script>
    // Remove splash when React app mounts
    window.addEventListener('load', function() {
      setTimeout(function() {
        var el = document.getElementById('splash');
        if (el) { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 600); }
      }, 1500);
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
